<style>
@font-face{
  font-family:'Cafe24Ohsquare';
  src:url('https://cdn.jsdelivr.net/gh/fontbee/font@main/Cafe24/Cafe24Ohsquare.woff') format('woff');
  font-weight:normal; font-style:normal; font-display:swap;
}
:root{
  --naver:#03C75A;
  --kakao:#FEE500; --kakao-d:#F2D900;
  --ink:#121212; --ink-2:#4E5968; --ink-3:#8B95A1;
  --paper:#FFFFFF; --soft:#F5F6F7; --rule:#E5E8EB;
  --sans:"Noto Sans KR", -apple-system, "맑은 고딕", sans-serif;
  --title:"Cafe24Ohsquare", "Noto Sans KR", sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--soft); color:var(--ink); font-family:var(--sans);
  font-size:17px; font-weight:500; line-height:1.7; letter-spacing:-.035em;
  min-height:100vh; min-height:100dvh;
  display:flex; align-items:center; justify-content:center;
  padding:1.5rem 1.25rem;
}
@media (min-width:768px){ body{font-size:18px} }

.card{
  width:100%; max-width:30rem; background:var(--paper);
  border-radius:1.5rem; padding:2.75rem 1.5rem 2rem;
  text-align:center; box-shadow:0 .5rem 2rem rgba(0,0,0,.06);
}
@media (min-width:768px){ .card{padding:3.25rem 2.25rem 2.5rem} }

/* 체크 아이콘 */
.check{
  width:4.5rem; height:4.5rem; margin:0 auto 1.5rem;
  border-radius:50%; background:var(--naver);
  display:flex; align-items:center; justify-content:center;
  animation:pop .45s cubic-bezier(.2,.9,.3,1.4) both;
}
.check svg{width:2.25rem;height:2.25rem;display:block}
.check path{
  stroke:#fff; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round; fill:none;
  stroke-dasharray:32; stroke-dashoffset:32;
  animation:draw .4s .3s ease-out forwards;
}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){
  .check,.check path{animation:none}
  .check path{stroke-dashoffset:0}
}

.eyebrow{
  display:inline-block; font-size:.9375rem; font-weight:700;
  color:var(--naver); letter-spacing:-.02em; margin-bottom:.65rem;
}
h1{
  font-family:var(--title); font-weight:400;
  font-size:1.5rem; line-height:1.45; letter-spacing:-.03em;
  word-break:keep-all;
}
@media (min-width:768px){ h1{font-size:1.75rem} }
h1 .date{color:var(--naver)}

.divider{height:1px;background:var(--rule);margin:1.75rem 0 1.5rem}

.guide{
  font-size:1.0625rem; color:var(--ink-2); font-weight:500;
  word-break:keep-all; margin-bottom:1.25rem;
}
.guide b{color:var(--ink);font-weight:700}

.btn{
  display:flex; align-items:center; justify-content:center; gap:.5rem;
  width:100%; padding:1.15rem 1rem;
  background:var(--kakao); color:#191600;
  border:0; border-radius:.875rem;
  font-family:var(--sans); font-size:1.1875rem; font-weight:900;
  letter-spacing:-.03em; text-decoration:none; cursor:pointer;
  transition:background .15s ease, transform .1s ease;
}
.btn:hover{background:var(--kakao-d)}
.btn:active{transform:scale(.985)}
.btn svg{width:1.35rem;height:1.35rem;flex:0 0 auto}

.note{
  margin-top:.9rem; font-size:.9375rem; line-height:1.6;
  color:#C0392B; font-weight:700; word-break:keep-all;
}
.sub{
  margin-top:1.5rem; padding-top:1.25rem; border-top:1px solid var(--rule);
  font-size:.9375rem; line-height:1.65; color:var(--ink-3); font-weight:500;
  word-break:keep-all;
}
.sub a{color:var(--ink-3)}
</style>
</head>
<body>

<main class="card">
  <div class="check" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M4.5 12.5 L10 18 L19.5 6.5"/></svg>
  </div>

  <span class="eyebrow">문찌언니의 숏폼 대행</span>

  <div class="divider"></div>

  <a class="btn" id="chatBtn" href="https://open.kakao.com/o/gx23uXKi" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#191600" d="M12 3C6.9 3 2.8 6.2 2.8 10.2c0 2.6 1.7 4.8 4.3 6.1-.2.7-.7 2.5-.8 2.9-.1.5.2.5.4.4.2-.1 2.7-1.8 3.7-2.6.5.1 1.1.1 1.6.1 5.1 0 9.2-3.2 9.2-7.2S17.1 3 12 3z"/></svg>

  <p class="sub">
    입력하신 번호로 문자와 카카오톡으로도 한 번 더 안내드립니다.<br>
    매니샵 · 대표 문지영 · 문의 <a href="mailto:nany418@naver.com">nany418@naver.com</a>
  </p>
</main>

<script>
(function(){
  var CFG = window.LP_CONFIG || {};
  function track(n,p){ p=p||{}; if(window.gtag) window.gtag('event',n,p); }

  /* 특강 일시 라벨은 CFG 한 곳에서 관리 */
  if(CFG.CLASS_DATE_LABEL_SHORT){
    var el=document.querySelector('[data-label]');
    if(el) el.textContent = CFG.CLASS_DATE_LABEL_SHORT;
  }

  var btn = document.getElementById('chatBtn');
  if(CFG.OPENCHAT_URL) btn.href = CFG.OPENCHAT_URL;

  /* 신청 유입 채널(RS 정산용)을 완료 페이지에서도 함께 남긴다 */
  var attr={};
  try{ attr = JSON.parse(localStorage.getItem('lp_attr')||'{}') || {}; }catch(e){}

  track('signup_complete_view', {
    utm_source: attr.utm_source||'', utm_medium: attr.utm_medium||'', utm_campaign: attr.utm_campaign||''
  });

  btn.addEventListener('click', function(){
    track('join_openchat', {
      utm_source: attr.utm_source||'', utm_medium: attr.utm_medium||'', utm_campaign: attr.utm_campaign||''
    });
  });
})();
</script>
</body>
</html>
